<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #141670;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Tarjeta central */
        .card-container {
            background: #9d0c0c;
            width: 100%;
            max-width: 480px;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        /* Encabezado y títulos */
        .header-section h1 {
            font-size: 1.85rem;
            font-weight: 700;
            color: #b6bdcc;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .nombre {
            font-size: 1.05rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 32px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .btn-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-radius: 12px;
            color: #94520d;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.15);
        }

        .btn-link:active {
            transform: translateY(0);
        }
        .btn-primary {
            background-color: #506aa4;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-success {
            background-color: #16a34a;
        }
        .btn-success:hover {
            background-color: #15803d;
        }
        .icon {
            width: 22px;
            height: 22px;
            min-width: 22px;
            min-height: 22px;
            stroke-width: 2;
        }
        .footer-info {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .badge {
            background-color: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
