<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega de Guías | Miguel Angel Meza Panta</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
            color: white;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 0% 0%, #0879ed 0%, transparent 30%),
                radial-gradient(ellipse at 100% 100%, #134de0 0%, transparent 35%),
                linear-gradient(135deg, #06113d, #111f80 65%, #070e38);
        }

        /* Decoración del fondo */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 650px;
            height: 300px;
            border-radius: 50%;
            z-index: -1;
            filter: blur(65px);
            pointer-events: none;
        }

        body::before {
            background: rgba(0, 132, 255, 0.25);
            top: -200px;
            left: -180px;
        }

        body::after {
            background: rgba(0, 85, 255, 0.25);
            bottom: -200px;
            right: -180px;
        }

        /* Tarjeta principal */
        .card-container {
            width: 100%;
            max-width: 650px;
            padding: 42px 35px;
            border-radius: 28px;
            background: linear-gradient(
                145deg,
                rgba(12, 40, 125, 0.92),
                rgba(3, 15, 65, 0.96)
            );
            border: 2px solid rgba(44, 123, 255, 0.75);
            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.4),
                0 0 35px rgba(0, 105, 255, 0.18);
            backdrop-filter: blur(15px);
            animation: aparecer 0.8s ease;
        }

        /* Encabezado */
        .header-section {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 42px;
        }

        .header-icon {
            width: 85px;
            height: 85px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1263ff, #1834ce);
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(0, 70, 255, 0.3);
        }

        .header-icon svg {
            width: 43px;
            height: 43px;
        }

        .header-text h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .nombre {
            font-size: 1rem;
            color: #b9c9ec;
            font-weight: 500;
        }

        .linea {
            width: 100px;
            height: 4px;
            margin-top: 16px;
            background: #078cff;
            border-radius: 10px;
        }

        /* Contenedor de guías */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.12);
        }

        .icon {
            width: 27px;
            height: 27px;
            stroke-width: 2;
        }

        .arrow {
            width: 24px;
            height: 24px;
            transition: transform 0.3s ease;
        }

        /* Botones azules */
        .btn-primary {
            background: linear-gradient(120deg, #1044a5, #173eae);
        }

        .btn-primary:hover {
            background: linear-gradient(120deg, #1763df, #2455d5);
        }

        /* Botones verdes */
        .btn-success {
            background: linear-gradient(120deg, #00ae43, #0ac83c);
        }

        .btn-success:hover {
            background: linear-gradient(120deg, #00c853, #10e34d);
        }

        /* Animación de botones */
        .btn-link:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
        }

        .btn-link:hover .arrow {
            transform: translateX(5px);
        }

        .btn-link:active {
            transform: scale(0.98);
        }

        .btn-link:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

        /* Animación de entrada */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Adaptación a celulares */
        @media (max-width: 600px) {
            .card-container {
                padding: 30px 20px;
                border-radius: 22px;
            }

            .header-section {
                flex-direction: column;
                text-align: center;
                gap: 18px;
                margin-bottom: 30px;
            }

            .header-text h1 {
                font-size: 1.65rem;
            }

            .linea {
                margin: 15px auto 0;
            }

            .btn-link {
                font-size: 1rem;
                padding: 12px 15px;
            }

            .btn-content {
                gap: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
